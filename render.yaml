# Render Blueprint: New → Blueprint → pick this repo. Values marked sync:false are asked for in the dashboard.
services:
  # Express API (Node runtime). Swap to `runtime: docker` + `dockerfilePath: ./Dockerfile` to use server/Dockerfile instead.
  - type: web
    name: appointments-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: appointments
      - key: SEED_ON_START
        value: "false"
      # Your frontend URL(s), comma-separated. Wildcards allowed, e.g. https://*.vercel.app
      - key: CORS_ORIGIN
        sync: false

  # Optional: host the frontend on Render too (skip if you use Vercel).
  - type: web
    name: appointments-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # /api is proxied to the API service below, so the browser stays on one origin and no CORS or
    # VITE_API_BASE_URL is needed. Rules run in order: the API rule must come before the SPA fallback.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://appointments-api-lam8.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
